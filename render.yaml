services:
  - type: web
    name: cultureshield-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/survey/questions
    envVars:
      - { key: PYTHON_VERSION, value: "3.11.9" }
      - { key: MONGO_URL, sync: false }          # MongoDB Atlas connection string
      - { key: DB_NAME, value: cultureshield }
      - { key: JWT_SECRET, generateValue: true }
      - { key: JWT_ALGORITHM, value: HS256 }
      - { key: ACCESS_TOKEN_EXPIRE_MINUTES, value: "1440" }
      - { key: MFA_ENCRYPTION_KEY, sync: false } # Fernet key, see backend/.env.example
      - { key: RESET_TOKEN_TTL_MINUTES, value: "20" }
      - { key: AUTH_RATE_LIMIT_WINDOW_MINUTES, value: "15" }
      - { key: AUTH_MAX_FAILED_ATTEMPTS, value: "5" }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: AI_MODEL, value: claude-sonnet-5 }
      - { key: PAYSTACK_SECRET_KEY, sync: false }
      - { key: PAYSTACK_PUBLIC_KEY, sync: false }
      - { key: BILLING_MODE, value: test }
      - { key: USD_TO_NGN_RATE, value: "1500" }
      - { key: RESEND_API_KEY, sync: false }
      - { key: SENDER_EMAIL, value: onboarding@resend.dev }
      - { key: FRONTEND_URL, sync: false }       # e.g. https://<user>.github.io/<repo>
      - { key: CORS_ORIGINS, sync: false }       # e.g. https://<user>.github.io
